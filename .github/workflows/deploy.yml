name: Test and deploy
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: prosto5-${{ github.event_name == 'pull_request' && github.ref || 'production' }}
  cancel-in-progress: false
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.11'
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '22'
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests
        env:
          DB_BACKEND: sqlite
      - run: node --test tests/*.cjs
      - run: bash -n deploy/*.sh
      - run: python -m unittest discover -s deploy/tests
  deploy:
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && vars.PRODUCTION_DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: production
    steps:
      - name: Deploy tested commit using a restricted SSH key
        shell: bash
        env:
          DEPLOY_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
          TARGET_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          [[ "$DEPLOY_HOST" =~ ^[a-zA-Z0-9][a-zA-Z0-9.-]*$ ]]
          [[ "$TARGET_SHA" =~ ^[0-9a-f]{40}$ ]]
          test -n "$DEPLOY_KEY"
          test -n "$KNOWN_HOSTS"
          umask 077
          task_ssh_dir=$(mktemp -d)
          trap 'rm -rf "$task_ssh_dir"' EXIT
          printf '%s\n' "$DEPLOY_KEY" > "$task_ssh_dir/key"
          printf '%s\n' "$KNOWN_HOSTS" > "$task_ssh_dir/known_hosts"
          ssh -i "$task_ssh_dir/key" -o BatchMode=yes -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$task_ssh_dir/known_hosts" \
            -o ConnectTimeout=20 -o ServerAliveInterval=30 -o ServerAliveCountMax=3 \
            "prosto5-deploy@$DEPLOY_HOST" "deploy $TARGET_SHA"
