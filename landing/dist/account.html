<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Личный кабинет — Круг Пи</title><link rel="icon" href="assets/images/favicon/favicon.svg"><link rel="stylesheet" href="account.css"><script src="account.js" defer></script></head><body>
<header><a href="/"><img src="assets/images/krug-pi.svg" alt="Круг Пи" width="200" height="56"></a><a href="/">На главную</a></header>
<main><section id="auth-panel"><p class="eyebrow">Математика · ОГЭ · ЕГЭ</p><h1 id="auth-title">Вход в личный кабинет</h1><p>Ваш профиль на сайте «Круг Пи».</p><nav aria-label="Выбор действия"><button id="login-tab" type="button">Вход</button><button id="register-tab" type="button">Регистрация</button></nav>
<form id="auth-form"><div id="name-group" hidden><label for="name">Имя</label><input id="name" name="name" maxlength="100" autocomplete="name"></div><label for="email">Электронная почта</label><input id="email" name="email" type="email" maxlength="254" autocomplete="username" required><label for="password">Пароль</label><input id="password" name="password" type="password" maxlength="128" autocomplete="current-password" required><p id="password-help" hidden>Используйте пароль длиной от 10 символов.</p><div id="repeat-group" hidden><label for="repeat">Повторите пароль</label><input id="repeat" type="password" maxlength="128" autocomplete="new-password"></div><button class="primary" id="submit" type="submit">Войти</button></form></section>
<section id="profile-panel" hidden><p class="eyebrow">Личный кабинет</p><h1 id="welcome">Ваш профиль</h1><dl><dt>Имя</dt><dd id="profile-name"></dd><dt>Email</dt><dd id="profile-email"></dd><dt>Роль</dt><dd id="profile-role"></dd></dl><p>Расписание занятий и учебные материалы появятся на следующем этапе.</p><button class="primary" id="logout" type="button">Выйти из аккаунта</button></section>
<p id="status" role="status" aria-live="polite"></p></main></body></html>
